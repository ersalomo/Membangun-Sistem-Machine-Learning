version: '3.8'

services:
  ml-serving:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ml-serving
    ports:
      - "8000:8000"
    restart: always

  prometheus:
    image: prom/prometheus:v2.45.0
    container_name: prometheus
    volumes:
      - ./2.prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - ml-serving
    restart: always

  grafana:
    image: grafana/grafana:10.0.3
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ROLE_SELECT_HEADER=X-WEBAUTH-ROLE
    volumes:
      - ./grafana/provisioning/datasources/datasource.yml:/etc/grafana/provisioning/datasources/datasource.yml:ro
      - ./grafana/provisioning/dashboards/dashboard.yml:/etc/grafana/provisioning/dashboards/dashboard.yml:ro
      - ./grafana/dashboards/wine_dashboard.json:/var/lib/grafana/dashboards/wine_dashboard.json:ro
    depends_on:
      - prometheus
    restart: always
